name: CI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  language-name: "temurin"

jobs:
  get-java-lts:
    name: Get LTS for Java
    runs-on: ubuntu-slim
    outputs:
      lts_versions_fetched: ${{ steps.getJavaVersion.outputs.lts_versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@48af1efe0a6e59552e4d1aa43beb0a069edb2c5f # v7.0.0

      - name: Get LTS for Java Temurin JDK
        uses: paulie-of-punskas/get-lts-versions@7fb9988c199343be72eedffcdce4e091cc4efd4a # golang
        id: getJavaVersion
        with:
          language: ${{ env.language-name }}
          versions_to_fetch: "2"

      - name: Print returned values
        id: outputJavaVersion
        shell: bash
        run: |
          echo "Fetched LTS versions: ${{ steps.getJavaVersion.outputs.lts_versions }}"

  setup-java-environment:
    name: Setup environment
    runs-on: ubuntu-22.04
    needs: get-java-lts
    strategy:
      matrix:
        lts_java_version: ${{ fromJson(needs.get-java-lts.outputs.lts_versions_fetched) }}
    steps:
      - name: Set up latest JDK for x64
        uses: actions/setup-java@main # test issue 1270
        with:
          java-version: ${{ matrix.lts_java_version }}
          distribution: ${{ env.language-name }}
          architecture: x64
