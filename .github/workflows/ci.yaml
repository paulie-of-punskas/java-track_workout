name: CI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  get-java-lts:
    name: Get LTS for Java
    runs-on: ubuntu-slim
    outputs:
      lts_versions_fetched: ${{ steps.getJavaVersion.outputs.lts_versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get LTS for Java Temurin JDK
        uses: paulie-of-punskas/get-lts-versions@4e26531a6afd8bdcd4364a911dde7378cbd26d14 #v1.0.1
        id: getJavaVersion
        with:
          language: "eclipse-temurin"
          versions_to_fetch: "3"

      - name: Print returned values
        id: outputJavaVersion
        shell: bash
        run: |
          echo "Fetched LTS versions: ${{ steps.getJavaVersion.outputs.lts_versions }}"

  setup-lts-environment:  
    name: Setup environment
    runs-on: ubuntu-22.04
    needs: get-java-lts        
    strategy:
      matrix:
        lts_java_version: ${{ fromJson(needs.get-java-lts.outputs.lts_versions_fetched) }}
    steps:
      - name: Set up latest JDK for x64
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.lts_java_version }}
          distribution: "temurin"
          architecture: x64
