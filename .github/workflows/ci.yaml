name: CI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  get-java-lts:
    name: Get LTS for Java
    runs-on: ubuntu-slim
    outputs:
      lts_versions_fetched: ${{ steps.outputJavaVersion.outputs.lts_versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get LTS for Java Temurin JDK
        uses: paulie-of-punskas/get-lts-versions@2c1d8ce4bdddd6d6dffc557b7c5f373ed14fc626 #v0.1.3
        id: getJavaVersion
        with:
          language: "eclipse-temurin"
          versions_to_fetch: "3"

      - name: Print returned values
        id: outputJavaVersion
        shell: bash
        run: |
          echo "Fetched LTS versions: ${{ steps.getJavaVersion.outputs.lts_versions }}"

  setup-lts-environment:  
    name: Setup environment
    runs-on: ubuntu-22.04
    needs: get-java-lts
    steps:
      - name: Print output
        run: |
          echo "Fetched LTS versions: ${{ needs.get-java-lts.outputs.lts_versions_fetched }}"
        
