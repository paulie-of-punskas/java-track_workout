name: CI

on:
  push:
    branches: 
      - 'main'
  workflow_dispatch: 

jobs:
  get-java-lts:
    name: Get LTS for JAVA
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get LTS for java
        uses: paulie-of-punskas/get-lts-versions@521947edbf993d2701ed4974b1a01aa58a95b64b #v0.1.2
        id: java
        with:
          language: "amazon-corretto"
          versions_to_fetch: "3"

      - name: Print returned values
        shell: bash
        run: echo "${{ steps.java.outputs.lts_versions }}"
