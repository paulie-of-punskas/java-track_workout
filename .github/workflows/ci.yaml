name: CI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  get-java-lts:
    name: Get LTS for JAVA
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get LTS for java - v012
        uses: paulie-of-punskas/get-lts-versions@521947edbf993d2701ed4974b1a01aa58a95b64b #v0.1.2
        id: java-old
        with:
          language: "eclipse-temurin"
          versions_to_fetch: "3"

      - name: Print returned values
        shell: bash
        run: |
          echo "${{ toJSON(steps.java-old.outputs.lts_versions) }}"

      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v4
        with:
            java-version: "${{ steps.java-old.outputs.lts_versions }}"
            distribution: "temurin"
            architecture: x64
